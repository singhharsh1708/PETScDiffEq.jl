name: x86probe
on:
  push:
    branches: [x86probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [float32-complex]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SciML/PETScDiffEq.jl
          ref: ${{ matrix.ref }}
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: x86
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: for ph in stops-then-disk t0-then-disk; do REF=${{ matrix.ref }} julia --project=. probe/x86.jl $ph 2>&1 | grep -v "PETSC ERROR" | tail -14; done
