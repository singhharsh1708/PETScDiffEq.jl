name: x86probe
on:
  push:
    branches: [x86probe]
jobs:
  bisect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cut: [0, 11, 12, 13, 40, 68, 69, 79]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SciML/PETScDiffEq.jl
          ref: float32-complex
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: x86
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.add(["DiffEqCallbacks", "Logging", "Test"]); Pkg.instantiate()'
      - run: julia --project=. probe/bisect.jl ${{ matrix.cut }} 2>&1 | grep -v "PETSC ERROR" | grep -E "CUT=|ran |item error|ERROR" | tail -20
